<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soto System - Carga de Pago Móvil</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card-pago {
            background-color: #0b1320;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .titulo {
            font-size: 20px;
            font-weight: 800;
            color: #10b981;
            margin-top: 0;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-align: center;
        }
        .subtitulo {
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 20px;
        }
        .datos-banco {
            background-color: #030712;
            border-left: 4px solid #10b981;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn-cargar {
            display: block;
            width: 100%;
            background-color: #10b981;
            color: #030712;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        .btn-cargar:active {
            transform: scale(0.98);
        }
        #file-input {
            display: none;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card-pago">
    <div class="titulo">Soto System POS</div>
    <div class="subtitulo">Comprobante de Pago Electrónico</div>

    <div class="datos-banco">
        <strong style="color: #10b981;">Datos de Pago Móvil:</strong><br>
        • <strong>Banco:</strong> Banesco (0134)<br>
        • <strong>Teléfono:</strong> 0412-5555555<br>
        • <strong>RIF:</strong> J-300000000
    </div>

    <!-- Formulario HTML5 con trigger directo a tu API de Django -->
    <form id="payment-form" enctype="multipart/form-data">
        <!-- El parámetro tx_id inyectado dinámicamente desde el views.py -->
        <input type="hidden" id="tx-id" value="{{ tx_id }}">
        
        <!-- accept="image/*" obliga al smartphone a desplegar la cámara o la galería -->
        <input type="file" id="file-input" name="capture_file" accept="image/*">
        
        <label for="file-input" class="btn-cargar" id="btn-label">
            📷 Tomar o Cargar Capture
        </label>
    </form>

    <div id="status" class="status-msg"></div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const btnLabel = document.getElementById('btn-label');
    const statusDiv = document.getElementById('status');
    const txId = document.getElementById('tx-id').value;

    fileInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            btnLabel.innerText = "⏳ Procesando Imagen...";
            btnLabel.style.backgroundColor = "#eab308";
            btnLabel.style.boxShadow = "none";
            
            const formData = new FormData();
            formData.append('capture_file', this.files[0]);

            // Despachamos la foto directo al endpoint de procesamiento en Railway
            fetch(`/api/v1/subir-capture/${txId}/`, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    btnLabel.innerText = "✔ ¡Enviado con Éxito!";
                    btnLabel.style.backgroundColor = "#10b981";
                    statusDiv.innerHTML = "🟢 El comprobante se sincronizó. Ya puede retirar su mercancía en taquilla.";
                    statusDiv.style.color = "#10b981";
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                btnLabel.innerText = "❌ Falló el envío";
                btnLabel.style.backgroundColor = "#ef4444";
                statusDiv.innerHTML = "🔴 Error: " + err.message;
                statusDiv.style.color = "#ef4444";
            });
        }
    });
</script>

</body>
</html>
